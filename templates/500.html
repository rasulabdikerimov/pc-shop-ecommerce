{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) — PC Shop</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <main class="main-content" style="display:flex; align-items:center; justify-content:center;">
        <div class="container">
            <div class="card" style="max-width:580px; margin:3rem auto; text-align:center; padding:3rem 2rem;">
                <div class="badge badge-danger mono" style="margin-bottom:1rem;">ERROR 500</div>
                <h1 style="font-size:1.85rem; margin-bottom:0.75rem;">Unexpected Server Error</h1>
                <p style="margin-bottom:1.75rem;">
                    Our engineering team has logged this issue. Please return to the storefront and try again shortly.
                </p>
                <a href="/" class="btn btn-primary">Return to Storefront</a>
            </div>
        </div>
    </main>
</body>
</html>
