{% extends 'shop/base.html' %}

{% block title %}Password Reset Complete — PC Shop{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card" style="text-align:center; padding:2.5rem 1.75rem;">
        <span class="badge badge-success" style="margin-bottom:0.75rem;">SUCCESS</span>
        <h1 style="font-size:1.5rem; margin-bottom:0.5rem;">Password Updated Successfully</h1>
        <p style="margin-bottom:1.5rem;">Your password has been reset. You may now sign in with your new credentials.</p>
        <a href="{% url 'shop:login' %}" class="btn btn-primary">Sign In Now</a>
    </div>
</div>
{% endblock %}
