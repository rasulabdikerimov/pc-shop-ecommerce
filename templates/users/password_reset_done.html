{% extends 'shop/base.html' %}

{% block title %}Recovery Link Sent — PC Shop{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card" style="text-align:center; padding:2.5rem 1.75rem;">
        <span class="badge badge-success" style="margin-bottom:0.75rem;">EMAIL SENT</span>
        <h1 style="font-size:1.5rem; margin-bottom:0.5rem;">Check Your Inbox</h1>
        <p style="margin-bottom:1.5rem;">
            If an account exists with the email address you entered, we have sent instructions for resetting your password.
        </p>
        <a href="{% url 'shop:login' %}" class="btn btn-primary">Return to Login</a>
    </div>
</div>
{% endblock %}
