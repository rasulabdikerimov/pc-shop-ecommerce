# Nginx Production Configuration for PC Shop (gshoptest.uz & www.gshoptest.uz)
# Place in: /etc/nginx/sites-available/shop_pc

# 1. Redirect all HTTP traffic to HTTPS canonical domain
server {
    listen 80;
    listen [::]:80;
    server_name gshoptest.uz www.gshoptest.uz;

    # ACME challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gshoptest.uz$request_uri;
    }
}

# 2. Redirect HTTPS www hostname to canonical non-www HTTPS domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gshoptest.uz;

    ssl_certificate /etc/letsencrypt/live/gshoptest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gshoptest.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://gshoptest.uz$request_uri;
}

# 3. Canonical HTTPS Application Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gshoptest.uz;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/gshoptest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gshoptest.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Static Files
    location /static/ {
        alias /var/www/shop_pc/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media Files (Uploaded Product & Profile Images)
    location /media/ {
        alias /var/www/shop_pc/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy Application Requests to Gunicorn Socket
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://unix:/run/gunicorn/shop_pc.sock;
    }
}
